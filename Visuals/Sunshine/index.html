<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunburst - Rust Palette</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #1a0904;
  overflow: hidden;
}

#scene {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

</style>
</head>
<body>

  <canvas id="scene"></canvas>

  <script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
let stars = [];

// ---- palette ----
const AZSHARA_VEIN = [181, 61, 24];   // #B53D18
const BROWN_SUGAR   = [205, 123, 76]; // #CD7B4C
const MELLOW_BUFF   = [215, 174, 148];// #D7AE94
// derived deep backdrop, same hue family as Azshara Vein, darkened for a night-sky base
const DEEP_BG_HEX = 'rgb(26,9,4)';
const MID_BG_HEX  = 'rgb(58,20,9)';

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
}
function rgb(c) { return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; }

// three-stop gradient helper: Mellow Buff -> Brown Sugar -> Azshara Vein
function rayColor(f) {
  return f < 0.5
    ? lerpColor(MELLOW_BUFF, BROWN_SUGAR, f * 2)
    : lerpColor(BROWN_SUGAR, AZSHARA_VEIN, (f - 0.5) * 2);
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;

  stars = [];
  const count = Math.floor((W * H) / 9000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.2
    });
  }
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------
// Sky + starfield
// ---------------------------------------------------------------
function drawSky(t) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  g.addColorStop(0, MID_BG_HEX);
  g.addColorStop(1, DEEP_BG_HEX);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.globalAlpha = twinkle;
    ctx.fillStyle = 'rgb(215,174,148)';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------
// Sunburst: narrow beaded rays, wobbling via sine
// ---------------------------------------------------------------
const RAY_COUNT = 36;
const BEADS_PER_RAY = 9;

function baseRadius() {
  return Math.min(W, H) * 0.24;
}

function drawSunburst(t) {
  const r0 = baseRadius();
  const hubR = r0 * 0.42;      // empty hole at the centre
  const rotation = t * 0.05;   // slow overall rotation

  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < RAY_COUNT; i++) {
    const angle = (i / RAY_COUNT) * Math.PI * 2 + rotation;

    // per-ray length pulse
    const lengthWave = Math.sin(t * 0.6 + i * 0.7) * 0.12;
    const rayLen = r0 * (1.9 + lengthWave);

    const dirX = Math.cos(angle);
    const dirY = Math.sin(angle);
    const perpX = -dirY;
    const perpY = dirX;

    for (let b = 0; b < BEADS_PER_RAY; b++) {
      const f = b / (BEADS_PER_RAY - 1); // 0 at hub, 1 at tip
      const dist = hubR + f * (rayLen - hubR);

      // intricate sine wobble: amplitude tapers to 0 at both ends
      const taper = Math.sin(f * Math.PI);
      const wobble =
        Math.sin(f * 14 + t * 1.4 + i * 0.5) * taper * (r0 * 0.035) +
        Math.sin(f * 27 - t * 2.1 + i * 0.9) * taper * (r0 * 0.015);

      const px = dirX * dist + perpX * wobble;
      const py = dirY * dist + perpY * wobble;

      // bead size: fatter near hub, tapering to a point at the tip
      const beadLen = (r0 * 0.16) * (1 - f * 0.75);
      const beadW = (r0 * 0.028) * (1 - f * 0.55);

      const color = rgb(rayColor(f));

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, 0, beadLen / 2, beadW / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.restore();
}

// ---------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------
function animate(timeMs) {
  const t = timeMs * 0.001;
  drawSky(t);
  drawSunburst(t);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

  </script>
</body>
</html>
